<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141A40"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Callcatch"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Callcatch Text-Back</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@600;700;800;900&family=Red+Hat+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: a navy masthead with the count of missed callers still waiting, one column of content under it, and a five-tab bar fixed to the bottom.
   A lead opens as a sheet from the bottom on phones and from the right on wide screens. Same family as Firstcall and Rebook.
   Type: Red Hat Display for names and numbers, Red Hat Text for everything else. Spacing 4 8 12 16 24. Corners 18 cards, 12 controls, full pills. */
:root{
  --bg:#F2F3F8; --surface:#FFFFFF; --surface-2:#F6F7FB; --ink:#141A40; --muted:#5B6287; --line:#E3E6F0; --line-2:#C8CDE0;
  --tint:rgba(20,26,64,.06); --tint-2:rgba(20,26,64,.11);
  --hero:#141A40; --hero-2:#212B6B; --hero-ink:#FFFFFF; --hero-muted:#B9BFE0; --hero-line:rgba(255,255,255,.14);
  --accent:#F58220; --accent-ink:#141A40; --accent-soft:#FDEBD8; --accent-deep:#A64D05;
  --primary:#141A40; --primary-ink:#FFFFFF;
  --blue:#2450B8; --blue-soft:#E3EAFB;
  --ok:#18733F; --ok-soft:#DEF3E6; --bad:#A3372F; --bad-soft:#F9E6E4; --amber:#855200; --amber-soft:#FBEFD3;
  --bubble-out:#141A40; --bubble-out-ink:#FFFFFF; --bubble-in:#E6E8F2; --bubble-in-ink:#141A40;
  --scrim:rgba(10,13,36,.52); --shadow:0 1px 2px rgba(20,26,64,.06),0 12px 32px rgba(20,26,64,.12);
  --font-display:"Red Hat Display","Red Hat Text",system-ui,sans-serif;
  --font-body:"Red Hat Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --rc:12px; --tabh:62px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A0D22; --surface:#131836; --surface-2:#191F44; --ink:#ECEEF9; --muted:#9AA1C6; --line:#242A54; --line-2:#363D70;
  --tint:rgba(236,238,249,.08); --tint-2:rgba(236,238,249,.14);
  --hero:#10153A; --hero-2:#1D2660; --hero-ink:#FFFFFF; --hero-muted:#AAB1D8; --hero-line:rgba(255,255,255,.12);
  --accent:#F58220; --accent-ink:#141A40; --accent-soft:#3B2611; --accent-deep:#FFAB5C;
  --primary:#F58220; --primary-ink:#141A40;
  --blue:#93B1F7; --blue-soft:#182650;
  --ok:#6FD39B; --ok-soft:#12301F; --bad:#F39088; --bad-soft:#3A1917; --amber:#EBB95E; --amber-soft:#35290F;
  --bubble-out:#F58220; --bubble-out-ink:#141A40; --bubble-in:#232A5C; --bubble-in-ink:#ECEEF9;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0A0D22; --surface:#131836; --surface-2:#191F44; --ink:#ECEEF9; --muted:#9AA1C6; --line:#242A54; --line-2:#363D70;
  --tint:rgba(236,238,249,.08); --tint-2:rgba(236,238,249,.14);
  --hero:#10153A; --hero-2:#1D2660; --hero-ink:#FFFFFF; --hero-muted:#AAB1D8; --hero-line:rgba(255,255,255,.12);
  --accent:#F58220; --accent-ink:#141A40; --accent-soft:#3B2611; --accent-deep:#FFAB5C;
  --primary:#F58220; --primary-ink:#141A40;
  --blue:#93B1F7; --blue-soft:#182650;
  --ok:#6FD39B; --ok-soft:#12301F; --bad:#F39088; --bad-soft:#3A1917; --amber:#EBB95E; --amber-soft:#35290F;
  --bubble-out:#F58220; --bubble-out-ink:#141A40; --bubble-in:#232A5C; --bubble-in-ink:#ECEEF9;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
html.lock,html.lock body{overflow:hidden}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}

/* masthead */
.hero{position:relative;background:linear-gradient(155deg,var(--hero) 30%,var(--hero-2) 130%);color:var(--hero-ink);overflow:hidden}
.hero::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--hero);z-index:25}
.hero-in{position:relative;max-width:820px;margin:0 auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:20px}
.hero.big .hero-in{padding-bottom:26px}
.brandrow{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font:800 21px/1 var(--font-display);letter-spacing:-.02em;margin-right:auto}
.brand svg{width:34px;height:34px;flex:none}
.brand i{font-style:normal;color:var(--accent)}
.onpill{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 14px 0 12px;border-radius:999px;border:1px solid var(--hero-line);background:rgba(255,255,255,.07);color:var(--hero-ink);font-weight:600;font-size:13px;white-space:nowrap}
.onpill .dot{width:8px;height:8px;border-radius:50%;background:#FF8A7A;flex:none}
.onpill.on .dot{background:#5EDB9A}
.headline{display:flex;align-items:flex-end;gap:14px}
.bignum{font:900 76px/.86 var(--font-display);letter-spacing:-.04em;color:var(--accent);font-variant-numeric:tabular-nums;min-width:.6em}
.headline h1{margin:0 0 4px;font:700 21px/1.15 var(--font-display);letter-spacing:-.01em;text-wrap:balance;max-width:14em}
.headline p{margin-top:5px;font-size:14px;color:var(--hero-muted)}
.funnel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--hero-line);border-radius:14px;overflow:hidden}
.funnel div{background:rgba(20,26,64,.55);padding:10px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.funnel b{font:800 20px/1 var(--font-display);font-variant-numeric:tabular-nums}
.funnel span{font-size:12px;color:var(--hero-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rings{position:absolute;right:-70px;top:-40px;width:330px;height:330px;pointer-events:none}
.rings path{fill:none;stroke-linecap:round;stroke:#fff;opacity:.06;stroke-width:12}
.rings path.hot{stroke:var(--accent);opacity:.5}
.pagehead{display:none}
.hero:not(.big) .headline,.hero:not(.big) .funnel{display:none}
.hero:not(.big) .pagehead{display:block}
.pagehead h1{font:800 24px/1.1 var(--font-display);letter-spacing:-.02em}
.pagehead p{margin-top:5px;font-size:14px;color:var(--hero-muted);max-width:56ch}

main{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:14px calc(var(--tabh) + 96px);display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:0 16px 2px} .chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;font-weight:600;font-size:13px;color:var(--muted);min-height:38px}
.chip b{font-weight:700;font-variant-numeric:tabular-nums;opacity:.75}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.notice{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:var(--rc);padding:12px 14px;font-size:14px}
.notice.warn{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.notice.err{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.notice.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.notice .acts{display:flex;gap:8px;flex-wrap:wrap}
#list{display:flex;flex-direction:column;gap:10px}

/* lead card */
.lead{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lead.unread{border-color:var(--accent)}
.lead-main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:14px 4px 14px 14px;border:0;background:none;text-align:left;min-width:0;width:100%}
.avatar{position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:800 15px/1 var(--font-display);background:var(--tint);color:var(--ink);flex:none}
.avatar svg{width:20px;height:20px}
.lead.unread .avatar::after{content:"";position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.lead-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.lead-top{display:flex;align-items:baseline;gap:8px;min-width:0}
.lead .nm{font:700 17px/1.25 var(--font-display);letter-spacing:-.01em;overflow-wrap:anywhere;min-width:0}
.lead .when{margin-left:auto;flex:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lead-sub{font-size:14px;color:var(--muted);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.lead-msg{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:0 10px;font-weight:600;font-size:12px;line-height:24px;white-space:nowrap;background:var(--tint);color:var(--muted);font-variant-numeric:tabular-nums}
.pill.hot{background:var(--accent-soft);color:var(--accent-deep)} .pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.callbtn{display:grid;place-items:center;width:50px;height:50px;margin:0 14px 0 6px;border-radius:50%;background:var(--primary);color:var(--primary-ink);text-decoration:none;flex:none;border:0}
.callbtn svg{width:21px;height:21px}
.callbtn[aria-disabled="true"]{background:var(--tint);color:var(--muted)}

.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);padding:28px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty h2{font:800 22px/1.15 var(--font-display);letter-spacing:-.02em;text-wrap:balance}
.empty p{max-width:56ch;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:var(--rc);border:0;background:var(--tint);font-weight:700;font-size:15px;color:var(--ink);text-align:center;text-decoration:none}
.btn:hover{background:var(--tint-2)}
.btn.primary{background:var(--primary);color:var(--primary-ink)} .btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:38px;padding:0 13px;font-size:14px} .btn.wide{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px;flex:none}
.linkbtn{background:none;border:0;padding:6px 2px;color:var(--accent-deep);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.loader{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 16px;color:var(--muted);font-weight:500;text-align:center}

/* sections and forms */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sec h3{font:700 13px/1.2 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sec h2{font:800 19px/1.2 var(--font-display);letter-spacing:-.01em}
.sec-head{display:flex;align-items:center;gap:8px}
.sec-head h3{margin-right:auto}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
.field input,.field select,.field textarea{border:1px solid var(--line-2);border-radius:var(--rc);background:var(--surface);padding:11px 12px;font-weight:400;font-size:16px;color:var(--ink);min-height:48px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:104px;resize:vertical;line-height:1.4}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.hint{font-size:13px;color:var(--muted);max-width:65ch}
.hint code,.codebox code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.95em}
.hint code{background:var(--tint);padding:1px 6px;border-radius:6px;color:var(--ink)}
.meter{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter.warn{color:var(--amber)} .meter b{font-weight:700}
.rowacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border:0;background:none;border-radius:12px;flex:none;color:inherit;text-decoration:none}
.iconbtn:hover{background:var(--tint)} .iconbtn svg{width:20px;height:20px}
.iconbtn.fill{background:var(--tint);width:38px;height:38px} .iconbtn.fill svg{width:17px;height:17px}
.iconbtn[disabled]{opacity:.3;cursor:default}
.switch{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;cursor:pointer}
.switch b{display:block;font-size:15px;font-weight:700}
.switch span span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.switch input{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:999px;background:var(--line-2);position:relative;margin:0;cursor:pointer;flex:none;transition:background-color .2s}
.switch input::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.2,.9,.3,1.2)}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(20px)}
.divide>*+*{border-top:1px solid var(--line);padding-top:12px}
.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.plain li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start}
.plain svg{width:18px;height:18px;margin-top:1px;color:var(--muted)}
.skiprow{display:flex;align-items:center;gap:8px;min-height:40px}
.skiprow .v{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.skiprow .v small{display:block;font-weight:400;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.stepno{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:800 13px/1 var(--font-display);flex:none}

/* text thread */
.thread{display:flex;flex-direction:column;gap:6px}
.bub{max-width:84%;padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.38;overflow-wrap:anywhere;white-space:pre-wrap}
.bub.out{align-self:flex-end;background:var(--bubble-out);color:var(--bubble-out-ink);border-bottom-right-radius:6px}
.bub.in{align-self:flex-start;background:var(--bubble-in);color:var(--bubble-in-ink);border-bottom-left-radius:6px}
.sysline{align-self:center;font-size:12px;font-weight:600;color:var(--muted);padding:4px 10px;text-align:center;font-variant-numeric:tabular-nums}
.bubtime{font-size:11px;color:var(--muted);margin:0 6px 4px;font-variant-numeric:tabular-nums} .bubtime.out{align-self:flex-end}
.compose{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.compose textarea{border:1px solid var(--line-2);border-radius:22px;background:var(--surface);padding:11px 16px;font-size:16px;min-height:46px;max-height:140px;resize:none;width:100%;line-height:1.35}
.compose textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sendbtn{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.sendbtn svg{width:20px;height:20px} .sendbtn[disabled]{opacity:.5}

/* test phone */
.phone{border:1px solid var(--line-2);border-radius:28px;background:var(--surface-2);padding:14px;display:flex;flex-direction:column;gap:12px;min-height:300px}
.phone-top{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.phone-top b{display:block;font:700 15px/1.2 var(--font-display)} .phone-top span span{display:block;font-size:12px;color:var(--muted)}
.phone .thread{flex:1;justify-content:flex-end}
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;border-radius:var(--rc);padding:12px 14px}
.verdict.yes{background:var(--ok-soft);color:var(--ok)} .verdict.no{background:var(--amber-soft);color:var(--amber)}
.verdict svg{width:22px;height:22px;margin-top:1px} .verdict b{display:block} .verdict span span{display:block;font-size:14px}
.quote{padding:12px 14px;border-radius:12px;background:var(--surface-2);border-left:3px solid var(--accent);overflow-wrap:anywhere;white-space:pre-wrap;font-size:14px}
.kv{display:grid;grid-template-columns:minmax(84px,auto) minmax(0,1fr);gap:9px 16px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere;font-weight:500}

/* setup */
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.step .body{display:flex;flex-direction:column;gap:10px;min-width:0}
.step ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;max-width:65ch}
.stepmark{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--ink);font:800 14px/1 var(--font-display);flex:none}
.stepmark.done{background:var(--ok-soft);color:var(--ok)} .stepmark svg{width:16px;height:16px}
.codebox{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--rc);padding:8px 8px 8px 12px;min-width:0}
.codebox code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;font-size:15px;user-select:all;-webkit-user-select:all;scrollbar-width:none}
.codebox small{display:block;font-size:12px;color:var(--muted);font-family:var(--font-body)}
.costs{width:100%;border-collapse:collapse;font-size:14px}
.costs td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top} .costs tr:first-child td{border-top:0}
.costs td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px}
.radio{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--rc);cursor:pointer}
.radio input{width:20px;height:20px;accent-color:var(--accent);margin:0}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 22px);z-index:41;background:var(--bg);border-radius:24px 24px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.sh-head{display:flex;align-items:center;gap:4px;padding:8px 8px 6px;position:relative}
.sh-head::before{content:"";position:absolute;left:50%;top:7px;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:var(--line-2)}
.sh-head .t{flex:1;min-width:0;text-align:center;font-weight:700;font-size:14px;color:var(--muted);padding-top:8px}

<script>
/* Callcatch conversation logic. Shared word for word by the engine and by the in-app test phone,
   so what the test shows is what a real caller gets. No network or storage in here. */
var Flow = (function () {
  "use strict";

  var DEFAULTS = {
    v: 1,
    enabled: true,
    business: "Sunwise Solar Cleaning",
    owner: "Will",
    areaCode: "07",
    steps: [
      { label: "Name", text: "Hi, it's {owner} from {business}. Sorry I missed your call, I'm likely up on a roof. What's your name and I'll get back to you?" },
      { label: "Address", text: "Thanks {first_name}. What's the address or suburb of the property?" },
      { label: "Job", text: "What can we help with? e.g. solar panel clean, health check, gutters. If it's panels, roughly how many?" },
      { label: "Best time to call", text: "Last one. When's a good time for me to call you back?" }
    ],
    closing: "Thanks {first_name}, that's all I need. I'll give you a call as soon as I can. Cheers, {owner} - {business}",
    optOutLine: true,
    skipKnown: true,
    skipList: [],
    cooldownHours: 12,
    voicemail: true,
    greeting: "Hi, you've called {owner} at {business}. Sorry I can't take your call right now. I've just sent you a text so I can get back to you faster. You can also leave a message after the tone.",
    greetingNoText: "Hi, you've called {owner} at {business}. Sorry I can't take your call right now. Please leave your name, number and a short message after the tone and I'll call you back.",
    notify: true,
    notifyNumber: ""
  };

  var OPT_OUT = " Reply STOP to opt out";
  var STOP_WORDS = ["stop", "stopall", "stop all", "unsubscribe", "cancel", "end", "quit", "opt out", "optout"];
  var REASONS = {
    off: "Text-back is switched off",
    "private": "Private number, nothing to text",
    landline: "Landline, can't receive texts",
    optout: "Asked not to be texted",
    skiplist: "On your skip list",
    client: "Already a ServiceM8 client",
    recent: "Already texted recently",
    owner: "Your own number"
  };

  function merge(saved) {
    var out = JSON.parse(JSON.stringify(DEFAULTS)), k;
    saved = saved || {};
    for (k in out) if (Object.prototype.hasOwnProperty.call(saved, k) && saved[k] !== null && saved[k] !== undefined) out[k] = saved[k];
    if (!Array.isArray(out.steps) || !out.steps.length) out.steps = JSON.parse(JSON.stringify(DEFAULTS.steps));
    out.steps = out.steps.slice(0, 8).map(function (s) {
      return { label: String((s && s.label) || "Answer").slice(0, 40), text: String((s && s.text) || "").slice(0, 600) };
    });
    if (!Array.isArray(out.skipList)) out.skipList = [];
    out.skipList = out.skipList.slice(0, 500).map(function (x) {
      return { phone: String((x && x.phone) || ""), name: String((x && x.name) || "").slice(0, 60) };
    }).filter(function (x) { return x.phone; });
    out.cooldownHours = Math.max(0, Math.min(720, Number(out.cooldownHours) || 0));
    ["business", "owner", "closing", "greeting", "greetingNoText", "notifyNumber", "areaCode"].forEach(function (f) { out[f] = String(out[f] == null ? "" : out[f]).slice(0, 600); });
    ["enabled", "optOutLine", "skipKnown", "voicemail", "notify"].forEach(function (f) { out[f] = !!out[f]; });
    return out;
  }

  /* Australian numbers to +61 form. Returns "" for anything that isn't a dialable number (private, blocked). */
  function norm(raw, areaCode) {
    var s = String(raw == null ? "" : raw).trim();
    if (!s || /anonymous|restricted|unavailable|private|unknown|blocked/i.test(s)) return "";
    var plus = s.charAt(0) === "+";
    var d = s.replace(/\D/g, "");
    if (!d || d === "266696687") return "";
    if (plus) return d.length >= 8 ? "+" + d : "";
    if (d.indexOf("0011") === 0) return "+" + d.slice(4);
    if (d.indexOf("61") === 0 && d.length === 11) return "+" + d;
    if (d.charAt(0) === "0" && d.length === 10) return "+61" + d.slice(1);
    if (d.length === 9 && /^[23478]/.test(d)) return "+61" + d;
    if (d.length === 8) { var a = String(areaCode || "07").replace(/\D/g, "").replace(/^0/, "") || "7"; return "+61" + a + d; }
    if (/^1[38]00\d{6}$/.test(d) || /^13\d{4}$/.test(d)) return "+61" + d;
    return d.length >= 8 ? "+" + d : "";
  }
  function isMobile(e164) { return /^\+614\d{8}$/.test(e164); }
  function pretty(e164) {
    var m = /^\+61(\d{9})$/.exec(e164 || "");
    if (!m) return e164 || "Private number";
    var d = "0" + m[1];
    return d.charAt(1) === "4" ? d.slice(0, 4) + " " + d.slice(4, 7) + " " + d.slice(7) : "(" + d.slice(0, 2) + ") " + d.slice(2, 6) + " " + d.slice(6);
  }

  function firstName(answer) {
    var s = String(answer || "").replace(/[\r\n]+/g, " ").trim();
    s = s.replace(/^(hi|hey|hello|g'?day|yeah|yep|yes|sure|no worries)[\s,.!-]+/i, "");
    s = s.replace(/^(it'?s|its|it is|my name is|my name'?s|name is|name'?s|this is|i'?m|i am|im)\s+/i, "");
    s = s.replace(/\s+(here|speaking)\b.*$/i, "").replace(/[.,!?]+$/, "").trim();
    var words = s.split(/\s+/).filter(Boolean);
    if (!words.length || words.length > 3) return "";
    if (!words.every(function (w) { return /^[A-Za-z][A-Za-z'\-]{0,24}$/.test(w); })) return "";
    var f = words[0];
    if (/^(who|what|why|wrong|sorry|stop|no|not|nah|ok|okay|thanks|cheers|call|please|mate|the|a|an)$/i.test(f)) return "";
    return cap(f);
  }
  function cap(w) { return String(w).toLowerCase().replace(/(^|[-'])([a-z])/g, function (m, a, b) { return a + b.toUpperCase(); }); }
  function fullName(answer) {
    var s = String(answer || "").replace(/[\r\n]+/g, " ").trim();
    if (!firstName(s)) return "";
    s = s.replace(/^(hi|hey|hello|g'?day|yeah|yep|yes|sure|no worries)[\s,.!-]+/i, "");
    s = s.replace(/^(it'?s|its|it is|my name is|my name'?s|name is|name'?s|this is|i'?m|i am|im)\s+/i, "");
    s = s.replace(/\s+(here|speaking)\b.*$/i, "").replace(/[.,!?]+$/, "").trim();
    return s.split(/\s+/).map(cap).join(" ");
  }

  /* Fill {business} {owner} {first_name}. A missing first name leaves no gap or stray comma behind. */
  function fill(tpl, settings, lead) {
    var fn = (lead && lead.firstName) || "";
    var out = String(tpl || "")
      .replace(/\{business\}/gi, settings.business || "")
      .replace(/\{owner\}/gi, settings.owner || "");
    if (fn) out = out.replace(/\{first_?name\}/gi, fn);
    else out = out.replace(/[ \t]*,?[ \t]*\{first_?name\}/gi, "");
    return out.replace(/[ \t]{2,}/g, " ").replace(/\s+([,.!?])/g, "$1").trim();
  }

  /* Text length the way carriers bill it: plain characters fit 160 to a text, anything fancy drops that to 70. */
  var GSM = "@£$¥èéùìòÇ\nØø\rÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ !\"#¤%&'()*+,-./0123456789:;<=>?¡ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÑÜ§¿abcdefghijklmnopqrstuvwxyzäöñüà";
  var GSM_EXT = "^{}\\[~]|€";
  function segments(text) {
    var s = String(text || ""), len = 0, plain = true, odd = [], i, ch;
    for (i = 0; i < s.length; i++) {
      ch = s.charAt(i);
      if (GSM.indexOf(ch) >= 0) len += 1;
      else if (GSM_EXT.indexOf(ch) >= 0) len += 2;
      else { plain = false; if (odd.indexOf(ch) < 0 && odd.length < 6) odd.push(ch); }
    }
    if (plain) return { plain: true, chars: len, parts: len <= 160 ? (len ? 1 : 0) : Math.ceil(len / 153), odd: odd };
    return { plain: false, chars: s.length, parts: s.length <= 70 ? 1 : Math.ceil(s.length / 67), odd: odd };
  }

  function stepText(settings, lead, i) {
    var t = fill(settings.steps[i].text, settings, lead);
    if (i === 0 && settings.optOutLine) t = t.replace(/\s+$/, "") + OPT_OUT;
    return t;
  }

  function newLead(phone, now, id) {
    return {
      id: id || "", phone: phone || "", name: "", firstName: "", source: "call",
      stage: "skipped", reason: "", status: "new", step: 0, answers: [], messages: [],
      calls: 1, lastCallAt: now, voicemails: [], knownName: "", notes: "", unread: true,
      createdAt: now, updatedAt: now, lastTextAt: 0
    };
  }
  function push(lead, dir, body, now) { lead.messages.push({ dir: dir, body: String(body), at: now }); if (lead.messages.length > 120) lead.messages = lead.messages.slice(-120); lead.updatedAt = now; }

  /* Should this missed call get a text? ctx: { known: name or null, optedOut: bool, last: the latest lead for this number or null } */
  function decide(settings, rawFrom, ctx, now) {
    ctx = ctx || {};

  h+='<div class="quick"><a class="qa call" href="tel:'+esc(L.phone)+'"'+(L.phone?"":' aria-disabled="true"')+'>'+ICON.phone+'Call back</a><button class="qa" data-act="copy" data-copy="'+esc(L.phone?Flow.pretty(L.phone):"")+'"'+(L.phone?"":' aria-disabled="true"')+'>'+ICON.copy+'<span class="num">'+esc(L.phone?Flow.pretty(L.phone):"No number")+'</span></button></div>';
  h+='<div class="seg" role="group" aria-label="Status">'+Object.keys(STATUS).map(function(k){return'<button data-act="status" data-st="'+k+'" aria-pressed="'+(L.status===k)+'">'+STATUS[k]+'</button>'}).join("")+'</div>';
  if(L.answers.length)h+='<section class="sec"><h3>What they told you</h3><dl class="kv">'+L.answers.map(function(a){return'<dt>'+esc(a.label)+'</dt><dd>'+esc(a.value)+'</dd>'}).join("")+'</dl></section>';
  if((L.voicemails||[]).length)h+='<section class="sec"><h3>Voicemail</h3>'+L.voicemails.map(function(v,i){return'<div><p class="hint">'+esc(longDate(v.at))+'</p>'+(S.status.live?'<audio controls preload="none" src="/api/recording/'+esc(L.id)+'/'+i+'"></audio>':"")+'</div>'}).join("")+'</section>';
  h+='<section class="sec"><h3>Conversation</h3><div class="thread" id="thread">'+threadHTML(L)+'</div>'+errBox("msg")+
    (canText?'<form class="compose" data-form="msg"><textarea id="msgtext" rows="1" placeholder="Text '+esc(L.firstName||"them")+' from your business number" aria-label="Write a text"></textarea><button class="sendbtn" type="submit" aria-label="Send text"'+(S.busy.msg?" disabled":"")+'>'+ICON.send+'</button></form>'+(S.status.live?"":'<p class="hint">Preview only. Nothing is sent.</p>'):
      '<p class="hint">'+(L.stage==="optout"?"They replied STOP, so texting is off for this number.":L.phone?"This number can't receive texts.":"The number was hidden, so there is nobody to text or call back.")+'</p>')+'</section>';
  h+='<section class="sec"><h3>Your notes</h3><label class="field">Notes on this caller<textarea id="notes" rows="3" placeholder="Quoted $, gate code, dog in yard">'+esc(L.notes||"")+'</textarea></label></section>';
  h+=S.confirmDel?'<div class="notice err"><span>Delete this missed call and its conversation for good?</span><div class="acts"><button class="btn sm danger" data-act="delyes">Delete</button><button class="btn sm" data-act="delno">Keep it</button></div></div>':'<button class="linkbtn" data-act="del" style="align-self:flex-start">Delete this missed call</button>';
  $("shbody").innerHTML=h;$("shlabel").textContent=(L.source==="text"?"Text in":"Missed call")+" · "+longDate(L.createdAt);
}
function openSheet(id){
  var L=leadOf(id);if(!L)return;S.open=id;S.confirmDel=false;S.err.msg="";
  $("sheetwrap").hidden=false;$("sheetwrap").classList.remove("closing");document.documentElement.classList.add("lock");renderSheet();$("shbody").scrollTop=0;
  if(L.unread){L.unread=false;Store.patchLead(id,{unread:false}).catch(function(){});renderView()}
}
function closeSheet(){
  if(!S.open)return;saveNotes(true);S.open=null;var w=$("sheetwrap");document.documentElement.classList.remove("lock");
  if(reduced()){w.hidden=true;return}w.classList.add("closing");setTimeout(function(){if(!S.open){w.hidden=true;w.classList.remove("closing")}},230);
}
function saveNotes(now){
  clearTimeout(S.noteT);var el=$("notes"),id=S.open,L=leadOf(id);if(!el||!L||el.value===(L.notes||""))return;
  var v=el.value;function run(){L.notes=v;Store.patchLead(id,{notes:v}).catch(function(e){toast(e.message)})}
  if(now)run();else S.noteT=setTimeout(run,700);
}

/* ---------- loading and refreshing ---------- */
function apply(d){S.leads=d.leads||[];S.status=d.status||S.status;var same=!dirty();S.settings=Flow.merge(d.settings);if(same||!S.ready)S.draft=clone(S.settings);S.ready=true}
function refresh(mode){
  return Store.load().then(function(d){
    hideGate();var ae=document.activeElement,typing=!!ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName),inMain=typing&&$("main").contains(ae);
    var before=S.open&&leadOf(S.open),sig=function(L){return L?L.messages.length+"|"+L.stage+"|"+L.status+"|"+(L.voicemails||[]).length:""},was=sig(before);
    apply(d);renderChrome();
    if(mode!=="poll"||S.view==="inbox"||(S.view==="setup"&&!inMain))renderView();
    if(S.open){var L=leadOf(S.open);if(!L)closeSheet();else if(mode==="poll"&&typing){if(was!==sig(L)){var t=$("thread");if(t)t.innerHTML=threadHTML(L)}}else if(was!==sig(L)||mode!=="poll")renderSheet()}
  },function(e){
    if(e.status===401)return showGate("login");if(e.code==="setup")return showGate("setup",e.steps);
    if(!S.ready){$("main").innerHTML='<div class="notice err"><span>'+esc(e.message)+'</span><div class="acts"><button class="btn sm" data-act="retry">Try again</button></div></div>'}
  });
}
var LOGO='<svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><rect x="4" y="4" width="92" height="92" rx="25" fill="#F58220"/><g fill="none" stroke="#141A40" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M28 28h44a9 9 0 0 1 9 9v22a9 9 0 0 1-9 9H49L35 80V68h-7a9 9 0 0 1-9-9V37a9 9 0 0 1 9-9z"/><path d="M64 39v5a7 7 0 0 1-7 7H38M45 44l-7 7 7 7"/></g></svg>';
function showGate(kind,steps){
  var g=$("gate");if(!g.hidden&&g.dataset.kind===kind)return;g.dataset.kind=kind;g.hidden=false;
  if(kind==="login")g.innerHTML='<form class="gate-in" data-form="login">'+LOGO+'<h1>Call<i>catch</i></h1><p>Enter the password you set on the engine.</p><input id="pw" type="password" autocomplete="current-password" aria-label="Password" placeholder="Password"><div class="err" id="pwerr" role="alert"></div><button class="btn accent wide" type="submit">Log in</button></form>';
  else g.innerHTML='<div class="gate-in">'+LOGO+'<h1>Almost there</h1><p>The engine is online but two settings are still missing in Cloudflare.</p><ol>'+(steps||[]).map(function(s){return"<li>"+esc(s)+"</li>"}).join("")+'</ol><button class="btn accent wide" data-act="retry">Check again</button></div>';
  var p=$("pw");if(p)p.focus();
}
function hideGate(){$("gate").hidden=true;$("gate").dataset.kind=""}

/* ---------- events ---------- */
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]");if(!el)return;var a=el.dataset.act,d=S.draft,i=Number(el.dataset.i);
  if(a==="tab"){if(S.open)closeSheet();go(el.dataset.tab)}
  else if(a==="filter"){S.filter=el.dataset.f;try{localStorage.setItem("callcatch-filter",S.filter)}catch(e){}renderView(true)}
  else if(a==="open")openSheet(el.dataset.id);
  else if(a==="close")closeSheet();
  else if(a==="copy")copyText(el.dataset.copy,el.parentNode.querySelector("code")||el.querySelector(".num"));
  else if(a==="retry")refresh();
  else if(a==="save"){var b=$("savebtn");b.disabled=true;Store.saveSettings(S.draft).then(function(s){S.settings=Flow.merge(s);S.draft=clone(S.settings);b.disabled=false;renderChrome();renderView();toast("Saved")},function(e){b.disabled=false;toast(e.message)})}
  else if(a==="discard"){S.draft=clone(S.settings);renderChrome();renderView()}
  else if(a==="stepadd"){d.steps.push({label:"Answer",text:""});renderView();syncSave();var t=$("f-steps-"+(d.steps.length-1)+"-text");if(t)t.focus()}
  else if(a==="stepdel"){d.steps.splice(i,1);renderView();syncSave()}
  else if(a==="stepup"&&i>1){d.steps.splice(i-1,0,d.steps.splice(i,1)[0]);renderView();syncSave()}
  else if(a==="stepdown"&&i<d.steps.length-1){d.steps.splice(i+1,0,d.steps.splice(i,1)[0]);renderView();syncSave()}
  else if(a==="resetscript"){var o=Flow.merge(null);d.steps=o.steps;d.closing=o.closing;renderView();syncSave();toast("Original script restored. Save to keep it.")}
  else if(a==="skipadd"){var nm=$("skipname").value.trim(),nu=$("skipnum").value.trim(),p=Flow.norm(nu,d.areaCode);
    if(!p){S.err.skip="That doesn't look like a phone number. Try it as 04XX XXX XXX.";renderView();return}
    if(d.skipList.some(function(x){return Flow.norm(x.phone,d.areaCode)===p})){S.err.skip="That number is already on the list.";renderView();return}
    S.err.skip="";d.skipList.push({name:nm,phone:p});renderView();syncSave()}
  else if(a==="skipdel"){d.skipList.splice(i,1);renderView();syncSave()}
  else if(a==="scen"){S.sim={scenario:el.dataset.s,lead:null,verdict:null,done:false,busy:false};renderView()}
  else if(a==="simcall")simCall();
  else if(a==="simsample"){var L=S.sim.lead;if(L)simReply(SAMPLE[L.step]||"Sounds good")}
  else if(a==="simstop")simReply("STOP");
  else if(a==="status"){var id=S.open,L2=leadOf(id),stv=el.dataset.st;if(!L2||L2.status===stv)return;var prev=L2.status;L2.status=stv;renderSheet();renderChrome();renderView();
    Store.patchLead(id,{status:stv}).then(function(){toast(stv==="booked"?"Booked. Nice one.":"Marked "+STATUS[stv].toLowerCase())},function(e){L2.status=prev;renderSheet();renderChrome();renderView();toast(e.message)})}
  else if(a==="del"){S.confirmDel=true;renderSheet();$("shbody").scrollTop=$("shbody").scrollHeight}
  else if(a==="delno"){S.confirmDel=false;renderSheet()}
  else if(a==="delyes"){var did=S.open;Store.deleteLead(did).then(function(){S.leads=S.leads.filter(function(x){return x.id!==did});S.noteT&&clearTimeout(S.noteT);S.open=null;$("sheetwrap").hidden=true;document.documentElement.classList.remove("lock");renderChrome();renderView();toast("Deleted")},function(e){toast(e.message)})}
  else if(a==="twconnect")act("tw","tw",function(){return call("POST","/api/twilio/connect",{sid:($("twsid")||{}).value,token:($("twtoken")||{}).value}).then(function(r){S.numbers=r.numbers})});
  else if(a==="twnum"){var r0=document.querySelector('input[name="twnum"]:checked');act("twnum","tw",function(){return call("POST","/api/twilio/number",{numberSid:r0?r0.value:""}).then(function(){S.numbers=null;return"Number connected"})})}
  else if(a==="twback"){S.numbers=null;renderView()}
  else if(a==="twtest")act("test","tw",function(){return call("POST","/api/twilio/test",{}).then(function(){return"Test text sent to your mobile"})});
  else if(a==="twoff")act("tw","tw",function(){return call("POST","/api/twilio/disconnect",{}).then(function(){S.numbers=null;return"Twilio disconnected"})});
  else if(a==="sm8connect")act("sm8","sm8",function(){return call("POST","/api/sm8/connect",{key:($("sm8key")||{}).value}).then(function(r){return r.count.toLocaleString("en-AU")+" client numbers loaded"})});
  else if(a==="sm8sync")act("sm8","sm8",function(){return call("POST","/api/sm8/connect",{}).then(function(r){return r.count.toLocaleString("en-AU")+" client numbers loaded"})});
  else if(a==="sm8off")act("sm8","sm8",function(){return call("POST","/api/sm8/disconnect",{}).then(function(){return"ServiceM8 disconnected"})});
  else if(a==="logout")call("POST","/api/logout",{}).then(function(){showGate("login")},function(){showGate("login")});
});
document.addEventListener("input",function(ev){
  var el=ev.target;
  if(el.id==="notes"){saveNotes();return}
  if(el.classList&&el.tagName==="TEXTAREA"&&el.closest(".compose")){el.style.height="auto";el.style.height=Math.min(140,el.scrollHeight+2)+"px";return}
  var b=el.dataset&&el.dataset.bind;if(!b||el.type==="checkbox")return;
  setPath(S.draft,b,el.type==="number"?Math.max(0,Math.min(720,Number(el.value)||0)):el.value);
  if(S.view==="script")refreshMeters();if(S.view==="rules")notifyHint();syncSave();
});
document.addEventListener("change",function(ev){
  var el=ev.target,b=el.dataset&&el.dataset.bind;if(!b||el.type!=="checkbox")return;
  setPath(S.draft,b,el.checked);if(S.view==="script")refreshMeters();if(S.view==="rules")notifyHint();syncSave();
});
document.addEventListener("submit",function(ev){
  var f=ev.target,kind=f.dataset&&f.dataset.form;if(!kind)return;ev.preventDefault();
  if(kind==="simreply"){var t=$("simtext");simReply(t.value,true)}
  else if(kind==="msg"){var m=$("msgtext"),text=m.value.trim(),id=S.open;if(!text||S.busy.msg)return;S.busy.msg=true;S.err.msg="";
    Store.sendMessage(id,text).then(function(L){S.busy.msg=false;putLead(L);if(S.open===id)renderSheet();renderChrome();renderView();toast(S.status.live?"Text sent":"Added to the preview. Nothing was sent.")},
      function(e){S.busy.msg=false;S.err.msg=e.message;if(S.open===id){renderSheet();var m2=$("msgtext");if(m2)m2.value=text}})}
  else if(kind==="login"){var p=$("pw");call("POST","/api/login",{password:p.value}).then(function(){refresh()},function(e){$("pwerr").textContent=e.message;p.select()})}
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"&&S.open)closeSheet();
  if(ev.key==="Enter"&&!ev.shiftKey&&ev.target.closest&&ev.target.closest(".compose")){ev.preventDefault();var f=ev.target.closest("form");if(f.requestSubmit)f.requestSubmit();else f.dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}))}
});
window.addEventListener("beforeunload",function(){saveNotes(true)});

/* ---------- start ---------- */
try{var f0=localStorage.getItem("callcatch-filter");if(f0&&CHIPS.some(function(x){return x[0]===f0}))S.filter=f0}catch(e){}
var h0=(location.hash||"").replace("#","");if(TABS.some(function(t){return t[0]===h0}))S.view=h0;
renderChrome();renderView();
refresh().then(function(){renderView(true)});
if(LIVE)setInterval(function(){if(document.visibilityState==="visible"&&$("gate").hidden&&S.ready)refresh("poll")},20000);
document.addEventListener("visibilitychange",function(){if(LIVE&&document.visibilityState==="visible"&&$("gate").hidden&&S.ready)refresh("poll")});
setTimeout(function(){var s=$("splash");if(s)s.remove()},2400);
})();

</script>
